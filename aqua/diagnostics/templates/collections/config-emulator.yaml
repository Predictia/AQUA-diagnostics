# AQUA emulator evaluation template for CESM2-derived predictions.
datasets:
  - catalog: null
    model: null
    exp: null
    source: null
    regrid: null
    reader_kwargs: null
    startdate: null
    enddate: null

references:
  - catalog: null
    model: CESM2
    exp: null
    source: null
    regrid: null
    reader_kwargs: null
    startdate: null
    enddate: null

setup:
  loglevel: WARNING

output:
  outputdir: ./
  rebuild: true
  save_netcdf: true
  save_format: [png, pdf]
  dpi: 300
  create_catalog_entry: false

diagnostics:
  rmse:
    run: true
    variables: &atmospheric_variables
      - {name: 2t}
      - {name: zg, level: [50000]}
  ssim:
    run: true
    variables: *atmospheric_variables
    params:
      default:
        win_size: null
        sigma: 1.5
        data_range: null
  acc:
    run: false
    variables: *atmospheric_variables
    climatology:
      catalog: null
      model: null
      exp: null
      source: null
      regrid: null
      startdate: null
      enddate: null
  cov:
    run: false
    variable_pairs:
      - var1: {name: 2t}
        var2: {name: zg, level: 50000}
  psd:
    run: false
    variables: *atmospheric_variables
    psd_calculations:
      time_averaged_psd: true
      psd_of_time_mean: true
  rollout:
    run: true
    variables: *atmospheric_variables
    annual: false
  spatiotemporal_rollout:
    run: false
    variables: *atmospheric_variables
    video: {format: gif, fps: 3, dpi: 150}
  variability:
    run: true
    variables: *atmospheric_variables
  spatial_agg:
    run: true
    variables: *atmospheric_variables
  seasonal_cycle:
    run: true
    variables: *atmospheric_variables
    regions:
      - {name: global}
      - {name: tropics, lat: [-20, 20]}
  ipo:
    run: false
    field: tos
    window: 13
    regions:
      southwest: {lat: [-45, -10], lon: [140, 220]}
      equatorial: {lat: [-10, 10], lon: [170, 270]}
      northwest: {lat: [25, 45], lon: [140, 215]}
    filter: {type: chebyshev, order: 4, ripple_db: 1.0}
  amo:
    run: false
    field: tos
    amo:
      region: {lat: [25, 60], lon: [-75, -7]}
      detrend: true
      detrend_variable: tos
      smooth: true
      window: 5
  vertical_zonal_mean:
    run: false
    variables:
      - {name: ta}
    aggregation: {stat: mean}
    latitude_bins: null
  zonal_mean_profile:
    run: false
    variables:
      - {name: 2t}
    aggregation: {stat: mean}
